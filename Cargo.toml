[package]
name = "braindb"
version = "0.1.0"
edition = "2021"
description = "BraindGo db — full-scale brain network simulation database"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/wanglilin/BraindGo"
rust-version = "1.75"

[lib]
name = "braindb"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "braindb-cli"
path = "src/bin/braindb_cli.rs"

[[bin]]
name = "braindb-server"
path = "src/bin/braindb_server.rs"
required-features = ["server"]

[dependencies]
memmap2 = "0.9"
bytemuck = { version = "1.14", features = ["derive"] }
thiserror = "1.0"
rayon = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
calamine = "0.22"
rand = "0.8"
realfft = "3"
nalgebra = "0.33"
static_assertions = "1.1"
clap = { version = "4", features = ["derive"], optional = true }
axum = { version = "0.7", optional = true }
tower-http = { version = "0.5", features = ["cors", "fs"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true }

# Optional deps
# NOTE: `extension-module` is opt-in via the `pyo3-extension-module` feature
# below; without it, `cargo test` can still link the test binary against
# libpython.
pyo3 = { version = "0.21", optional = true }
sundials-sys = { version = "0.5", optional = true }
dashmap = { version = "6", optional = true }
cudarc = { version = "0.13", optional = true }

[features]
# Default features (per user request).
# NOTE: building with `python` requires a working Python installation
# (PYO3_PYTHON env var or python in PATH). If it fails locally,
# set `default = []` here.
default = ["python"]

python = ["dep:pyo3"]
# Enable this when building a Python wheel (e.g. via maturin/PyO3); it
# disables linking against libpython so the resulting .pyd/.so can be
# imported from any Python interpreter.
pyo3-extension-module = ["python", "pyo3/extension-module"]
distributed = ["dashmap", "dep:tokio"]
implicit_integrator = ["sundials-sys"]
cuda = ["cudarc"]
cli = ["dep:clap"]
server = ["cli", "dep:axum", "dep:tower-http", "dep:tokio", "dep:tracing", "dep:tracing-subscriber"]

[dev-dependencies]
tempfile = "3"
